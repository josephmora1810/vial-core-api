paths:
  # ==========================================
  # SISTEMA
  # ==========================================
  /ping:
    get:
      summary: Smoke test / Ping del sistema
      description: Comprueba que el servidor HTTP y el enrutador se encuentren activos y respondiendo.
      tags:
        - Sistema
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Pong! API is alive and kicking.
                  timestamp:
                    type: integer
                    example: 1792025744

  /teapot:
    get:
      summary: Verificación RFC 2324 (I'm a teapot)
      description: Endpoint de verificación lúdica y conformidad de estándares RFC 2324 / Hyper Text Coffee Pot Control Protocol.
      tags:
        - Sistema
      responses:
        '418':
          description: I'm a teapot
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fail
                  code:
                    type: integer
                    example: 418
                  message:
                    type: string
                    example: I'm a teapot

  # ==========================================
  # AUTENTICACIÓN
  # ==========================================
  /login:
    post:
      summary: Iniciar Sesión (FR-02)
      description: |
        Valida las credenciales de un usuario activo con hash Bcrypt.
        Retorna un JWT stateless (`access_token`, 15 min de vigencia) y un token opaco criptográfico (`refresh_token`, 30 días de vigencia) almacenado en MariaDB.
        Sujeto a Rate Limiting de 5 intentos por minuto vía Redis (NFR-11).
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: cliente@ubikgo.test
                password:
                  type: string
                  format: password
                  example: Password123!
      responses:
        '200':
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Inicio de sesión exitoso.
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                      refresh_token:
                        type: string
                        example: 97b7bb0f66739299316279f763abf1ee2b35563694bcfee4e14f5fae9dfc2daf
                      user:
                        $ref: '#/components/schemas/UserDto'
        '400':
          description: Correo o contraseña no suministrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciales inválidas o usuario inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Límite de peticiones excedido (Throttle activado por Redis)

  /scan-identity:
    post:
      summary: Pre-escaneo de Cédula de Identidad con OCR (FR-07)
      description: |
        Procesa la fotografía o PDF de una Cédula de Identidad venezolana mediante el microservicio OCR Docker.
        Devuelve los patronímicos extraídos (`identification_card`, `names`, `surnames`, `birth_date`, `confidence`) y guarda temporalmente el archivo en disco (`file_path`).
        Permite al frontend mostrar una vista previa interactiva para que el usuario verifique y corrija manualmente posibles errores de lectura antes de llamar a `/register`.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  type: string
                  format: binary
                  description: Imagen nítida (JPG/PNG) o PDF de la Cédula de Identidad venezolana.
                file_path:
                  type: string
                  description: Opcional. Ruta absoluta en el servidor si el archivo ya fue subido previamente.
      responses:
        '200':
          description: Cédula escaneada y procesada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Cédula procesada exitosamente.
                  data:
                    type: object
                    properties:
                      suggested_identity:
                        type: object
                        properties:
                          identification_card:
                            type: string
                            example: V-80123456
                          names:
                            type: string
                            example: ANDREÍNA SOFÍA
                          surnames:
                            type: string
                            example: QUINTERO BASTIDAS
                          birth_date:
                            type: string
                            format: date
                            example: 1990-04-17
                          confidence:
                            type: number
                            format: float
                            example: 0.95
                      file_path:
                        type: string
                        example: storage/documents/cedula_scan_a1b2c3d4.jpg
                      warnings:
                        type: array
                        items:
                          type: string
                        example: []
                      message:
                        type: string
                        example: Cédula procesada exitosamente. Por favor verifique y corrija los datos si es necesario antes de confirmar el registro.
        '400':
          description: No se adjuntó el archivo o excedió el límite de subida PHP (upload_max_filesize)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Documento ilegible, formato incompatible o error de extracción OCR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: El microservicio de OCR no se encuentra disponible

  /register:
    post:
      summary: Registro Multi-perfil con Validación KYC y Corrección Manual (FR-01, FR-03, FR-07)
      description: |
        Registra nuevos usuarios con rol `client`, `driver` o `seller`. Prohíbe registro público de `admin` (403).
        Acepta la subida directa de la Cédula (`document`) o la ruta temporal devuelta por `/scan-identity` (`file_path`).
        Soporta **corrección manual de patronímicos** (`identification_card`, `names`, `surnames`, `birth_date`).
        - Si el usuario suministra correcciones manuales, el documento se registra como `PENDING` para auditoría manual.
        - Si los datos provienen del OCR sin modificaciones, se marca automáticamente como `VERIFIED`.
        - Valida unicidad global de **correo electrónico** y de **cédula de identidad** (1 persona física = 1 sola cuenta).
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - password
                - phone
                - role
              properties:
                email:
                  type: string
                  format: email
                  example: cliente@ubikgo.test
                password:
                  type: string
                  format: password
                  example: Password123!
                phone:
                  type: string
                  example: +584121234567
                role:
                  type: string
                  enum: [client, driver, seller]
                  example: client
                terms_accepted:
                  type: boolean
                  description: Consentimiento obligatorio de términos y privacidad (FR-03). Puede enviarse también como `consent`.
                  example: true
                consent:
                  type: boolean
                  description: Alias de `terms_accepted`.
                  example: true
                document:
                  type: string
                  format: binary
                  description: Archivo JPG/PNG/PDF de la Cédula (obligatorio si no se envía `file_path` ni patronímicos manuales completos).
                file_path:
                  type: string
                  description: Ruta temporal del archivo devuelta por `/scan-identity`.
                identification_card:
                  type: string
                  description: Cédula venezolana corregida o manual (ej. V-12345678, E-87654321).
                  example: V-80123456
                names:
                  type: string
                  description: Nombres corregidos o manuales.
                  example: ANDREÍNA SOFÍA
                surnames:
                  type: string
                  description: Apellidos corregidos o manuales.
                  example: QUINTERO BASTIDAS
                birth_date:
                  type: string
                  format: date
                  description: Fecha de nacimiento corregida o manual (YYYY-MM-DD).
                  example: 1990-04-17
      responses:
        '201':
          description: Usuario registrado y verificado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Usuario registrado y verificado exitosamente.
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/UserDto'
                      token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                      refresh_token:
                        type: string
                        example: 178e820d7fdf6af7f83ff18fa5988aa919c723d1e872642b73872e031fb3fd3b
        '400':
          description: Faltan campos requeridos, términos no aceptados o archivo excede límites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Intento de registro no permitido (ej. solicitar rol admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicto - El correo electrónico o la Cédula de Identidad ya están registrados en el sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Error en extracción del documento y no se suministraron patronímicos manuales completos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me:
    get:
      summary: Consultar Perfil del Usuario Autenticado
      description: Devuelve el DTO del usuario autenticado con su saldo en billetera (VES), roles y permisos.
      tags:
        - Autenticación
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Datos del perfil del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Usuario autenticado.
                  data:
                    $ref: '#/components/schemas/UserDto'
        '401':
          description: Token JWT no proporcionado o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /refresh-token:
    post:
      summary: Renovar Token de Acceso JWT (FR-02 / NFR-15)
      description: |
        Envía un Refresh Token válido para recibir un nuevo Access Token JWT y rotar el Refresh Token.
        Invalida automáticamente el Refresh Token anterior en MariaDB.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  example: 178e820d7fdf6af7f83ff18fa5988aa919c723d1e872642b73872e031fb3fd3b
      responses:
        '200':
          description: Token renovado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Token renovado exitosamente.
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                      refresh_token:
                        type: string
                        example: d9a4b3c2...
        '400':
          description: Campo refresh_token no enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Refresh token revocado, expirado o inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /logout:
    post:
      summary: Cerrar Sesión / Revocación de Token
      description: Revoca de forma inmediata el Refresh Token en MariaDB impidiendo su uso posterior.
      tags:
        - Autenticación
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  example: 178e820d7fdf6af7f83ff18fa5988aa919c723d1e872642b73872e031fb3fd3b
      responses:
        '200':
          description: Sesión cerrada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Sesión cerrada exitosamente.
                  data:
                    type: array
                    items: {}
                    example: []
        '400':
          description: Campo refresh_token no enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /forgot-password:
    post:
      summary: Solicitar Código OTP de Recuperación de Contraseña (FR-06)
      description: |
        Genera un código numérico criptográfico de 6 dígitos con vigencia de 15 minutos en Redis.
        Despacha un correo electrónico con plantilla HTML mediante servidor SMTP real.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: cliente@ubikgo.test
      responses:
        '200':
          description: Correo despachado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Código de recuperación enviado a su correo electrónico.
                  data:
                    type: array
                    items: {}
                    example: []
        '400':
          description: Correo electrónico inválido o no suministrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe una cuenta registrada con ese correo electrónico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reset-password:
    post:
      summary: Restablecer Contraseña con Código OTP (FR-06)
      description: |
        Verifica el código OTP de 6 dígitos en Redis.
        Actualiza el hash Bcrypt de la contraseña y revoca todos los tokens activos del usuario.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
                - password
                - password_confirmation
              properties:
                email:
                  type: string
                  format: email
                  example: cliente@ubikgo.test
                code:
                  type: string
                  example: "123456"
                password:
                  type: string
                  format: password
                  example: NewSecurePassword123!
                password_confirmation:
                  type: string
                  format: password
                  example: NewSecurePassword123!
      responses:
        '200':
          description: Contraseña restablecida con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Contraseña actualizada exitosamente.
                  data:
                    type: array
                    items: {}
                    example: []
        '400':
          description: Código incorrecto, expirado o confirmación de contraseña no coincide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # DOCUMENTOS KYC
  # ==========================================
  /documents/upload:
    post:
      summary: Cargar o Reenviar Documentos KYC (FR-07, FR-09, FR-10, FR-33, NFR-17, NFR-20-B)
      description: |
        Permite adjuntar documentos de identidad (cédula, pasaporte, licencia) o documentos vehiculares (carnet de circulación, certificado NIV).
        El archivo es limpiado automáticamente de metadatos EXIF (NFR-17) y encolado en segundo plano en Redis (`queue:s3_document_uploads`)
        para su transferencia persistente hacia Amazon Web Services (AWS S3, bucket `ubik-go`).
        Si el documento fue rechazado anteriormente, reinicia el estado a `PENDING` para nueva revisión por auditores.
      tags:
        - Documentos KYC
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - document_type
              properties:
                document_type:
                  type: string
                  enum: [identity_card, passport, vehicle_registration, niv_certificate, driving_license]
                  example: vehicle_registration
                vehicle_id:
                  type: integer
                  description: ID interno del vehículo si el documento corresponde a uno (obligatorio para documentos vehiculares).
                  example: 1
                document:
                  type: string
                  format: binary
                  description: Archivo JPG/PNG/PDF del documento a subir.
                file_path:
                  type: string
                  description: Opcional. Ruta en servidor si el archivo ya fue subido previamente.
      responses:
        '201':
          description: Documento cargado exitosamente en estado PENDING
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Documento procesado con éxito.
                  data:
                    type: object
                    properties:
                      document_id:
                        type: integer
                        example: 12
                      document_type:
                        type: string
                        example: vehicle_registration
                      status:
                        type: string
                        example: pending
                      file_path:
                        type: string
                        example: storage/documents/doc_1_vehicle_registration_abcdef1234.jpg
        '400':
          description: Parámetros inválidos o error en el archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El documento ya se encuentra verificado y aprobado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Falta document_type o archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents/kyc-status:
    get:
      summary: Consultar Estado Global KYC del Usuario (FR-10)
      description: Retorna el estado consolidado de validación KYC (cédula, pasaporte, licencia y documentos vehiculares).
      tags:
        - Documentos KYC
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Estado KYC consultado con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Estado KYC consultado con éxito.
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        example: 1
                      is_identity_verified:
                        type: boolean
                        example: true
                      has_verified_vehicle:
                        type: boolean
                        example: false
                      is_fully_kyc_passed:
                        type: boolean
                        example: false
                      documents:
                        type: object
                        properties:
                          identity_card:
                            type: object
                            nullable: true
                            properties:
                              status:
                                type: string
                                example: verified
                              file_path:
                                type: string
                                example: storage/documents/cedula_1_a1b2c3.jpg
                          passport:
                            type: object
                            nullable: true
                          driving_license:
                            type: object
                            nullable: true
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # DIRECCIONES GUARDADAS (FR-19)
  # ==========================================
  /addresses:
    get:
      summary: Listar Direcciones Guardadas del Usuario (FR-19)
      description: Retorna la libreta de direcciones favoritas con coordenadas GPS para solicitudes rápidas de grúa.
      tags:
        - Direcciones Guardadas
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Listado de direcciones guardadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Direcciones consultadas con éxito.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedAddressDto'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Guardar Nueva Dirección con Coordenadas GPS (FR-19)
      description: Registra una nueva dirección favorita validando que la latitud (-90..90) y longitud (-180..180) pertenezcan a rangos válidos.
      tags:
        - Direcciones Guardadas
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
                - address_line
                - latitude
                - longitude
              properties:
                label:
                  type: string
                  example: Mi Casa
                address_line:
                  type: string
                  example: Calle Los Pinos, Quinta María, Caracas
                latitude:
                  type: number
                  format: float
                  example: 10.488012
                longitude:
                  type: number
                  format: float
                  example: -66.862145
                is_favorite:
                  type: boolean
                  example: true
      responses:
        '201':
          description: Dirección guardada con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Dirección guardada con éxito.
                  data:
                    $ref: '#/components/schemas/SavedAddressDto'
        '400':
          description: Coordenadas GPS fuera del rango geométrico válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Campos obligatorios faltantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /addresses/{id}:
    delete:
      summary: Eliminar Dirección Guardada por UUID
      description: Elimina de la libreta una dirección guardada verificando que pertenezca al usuario autenticado.
      tags:
        - Direcciones Guardadas
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID v7 de la dirección guardada
          schema:
            type: string
            format: uuid
            example: 01a13e2f-5b6c-7f8a-9012-3456789abcde
      responses:
        '200':
          description: Dirección eliminada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Dirección eliminada con éxito.
                  data:
                    type: array
                    items: {}
                    example: []
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dirección no encontrada o no pertenece al usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # CATÁLOGO DE VEHÍCULOS
  # ==========================================
  /vehicles/catalog/classes:
    get:
      summary: Consultar Catálogo Maestro de Clases de Vehículos
      description: Retorna la lista oficial de clases vehiculares (Automóvil, Camioneta, Camión, Moto, etc.). Almacenado en Redis.
      tags:
        - Catálogo de Vehículos
      responses:
        '200':
          description: Clases de vehículos consultadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Clases de vehículos consultadas.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        code:
                          type: string
                          example: AUTOMOVIL
                        name:
                          type: string
                          example: Automovil
                        description:
                          type: string
                          example: Vehículos de pasajeros de 4 ruedas estándar

  /vehicles/catalog/brands:
    get:
      summary: Consultar Catálogo Maestro de Marcas de Vehículos
      description: Retorna las marcas automotrices disponibles con soporte de búsqueda en tiempo real mediante parámetro `q`.
      tags:
        - Catálogo de Vehículos
      parameters:
        - name: q
          in: query
          required: false
          description: Filtro de búsqueda textual por prefijo o coincidencia de marca (ej. `toy`)
          schema:
            type: string
            example: toy
      responses:
        '200':
          description: Marcas consultadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Marcas consultadas.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 531
                        name:
                          type: string
                          example: Toyota

  /vehicles/catalog/models:
    get:
      summary: Consultar Catálogo Maestro de Modelos por Marca
      description: Retorna los modelos asociados a una marca específica con soporte de búsqueda por `q`. Cacheado en Redis con TTL de 24 horas.
      tags:
        - Catálogo de Vehículos
      parameters:
        - name: brand_id
          in: query
          required: true
          description: ID numérico de la marca
          schema:
            type: integer
            example: 531
        - name: q
          in: query
          required: false
          description: Filtro de búsqueda textual de modelo (ej. `cor`)
          schema:
            type: string
            example: cor
      responses:
        '200':
          description: Modelos consultados
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Modelos consultados.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        brand_id:
                          type: integer
                          example: 531
                        vehicle_class_id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Corolla
        '422':
          description: Parámetro brand_id no proporcionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # GESTIÓN DE VEHÍCULOS (FR-18)
  # ==========================================
  /vehicles/scan:
    post:
      summary: Escaneo OCR de Documento Vehicular (Carnet o Título)
      description: |
        Procesa mediante OCR una imagen de **Carnet de Circulación** (`vehicle_registration`) o de **Título de Propiedad / NIV** (`vehicle_title`).
        Extrae y normaliza placa, NIV, serial de motor, año, color, marca y modelo, cruzándolos contra el catálogo maestro en MariaDB y Redis.
        Retorna la coincidencia sugerida (`suggested_vehicle`), la ruta temporal del archivo (`file_path`) y las advertencias (`warnings`) en caso de campos ambiguos.
      tags:
        - Vehículos
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  type: string
                  format: binary
                  description: Fotografía nítida del Carnet de Circulación o Título de Propiedad.
                document_type:
                  type: string
                  enum: [vehicle_registration, vehicle_title]
                  default: vehicle_registration
                  description: Tipo de documento vehicular a procesar.
                file_path:
                  type: string
                  description: Opcional. Ruta de archivo en servidor si ya fue subido previamente.
      responses:
        '200':
          description: Documento vehicular procesado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Documento vehicular procesado exitosamente.
                  data:
                    type: object
                    properties:
                      suggested_vehicle:
                        type: object
                        properties:
                          plate_number:
                            type: string
                            example: AB123CD
                          niv:
                            type: string
                            example: 8X123456789012345
                          engine_serial:
                            type: string
                            example: ENG998877
                          year:
                            type: integer
                            example: 2018
                          color:
                            type: string
                            example: Gris Plata
                          brand_name:
                            type: string
                            example: Toyota
                          model_name:
                            type: string
                            example: Corolla
                          vehicle_class_name:
                            type: string
                            example: Automovil
                          matched_catalog:
                            type: object
                            properties:
                              brand_id:
                                type: integer
                                example: 531
                              model_id:
                                type: integer
                                example: 1
                              vehicle_class_id:
                                type: integer
                                example: 1
                              vehicle_subclass_id:
                                type: integer
                                nullable: true
                                example: null
                      document_type:
                        type: string
                        example: vehicle_registration
                      warnings:
                        type: array
                        items:
                          type: string
                        example: []
                      raw_ocr:
                        type: object
                      file_path:
                        type: string
                        example: storage/documents/carnet_1_a1b2c3d4.jpg
                      message:
                        type: string
                        example: Documento escaneado. Por favor verifique los campos sugeridos antes de confirmar.
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Archivo no enviado o corrupto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /vehicles:
    get:
      summary: Listar Vehículos Propios del Usuario (FR-18)
      description: Retorna la lista de vehículos activos asociados al usuario autenticado, con sus estados de verificación y UUIDs v7.
      tags:
        - Vehículos
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de vehículos consultada con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Vehículos consultados con éxito.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VehicleDto'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Registrar Nuevo Vehículo Propio (FR-18)
      description: |
        Registra un vehículo propio vinculándolo a la cuenta del usuario. Requiere permiso `register_vehicle` (otorgado al rol `client`).
        Acepta los IDs normalizados del catálogo maestro (`brand_id`, `model_id`, `vehicle_class_id`) o nombres libres (`brand_name`, `model_name`).
        Si se envía `carnet_file_path`, asocia automáticamente el archivo como documento KYC vehicular en estado `PENDING`.
        Valida que la Placa y el N.I.V no se encuentren duplicados en el sistema.
      tags:
        - Vehículos
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - plate_number
                - niv
                - year
                - color
              properties:
                plate_number:
                  type: string
                  example: AB123CD
                niv:
                  type: string
                  example: 8X123456789012345
                year:
                  type: integer
                  example: 2018
                color:
                  type: string
                  example: Gris Plata
                engine_serial:
                  type: string
                  example: ENG998877
                brand_id:
                  type: integer
                  example: 531
                model_id:
                  type: integer
                  example: 1
                vehicle_class_id:
                  type: integer
                  example: 1
                vehicle_subclass_id:
                  type: integer
                  nullable: true
                  example: null
                brand_name:
                  type: string
                  example: Toyota
                model_name:
                  type: string
                  example: Corolla
                carnet_file_path:
                  type: string
                  description: Ruta temporal devuelta por `/vehicles/scan` para asociar el comprobante KYC del vehículo.
                  example: storage/documents/carnet_1_a1b2c3d4.jpg
                document_type:
                  type: string
                  enum: [vehicle_registration, vehicle_title]
                  default: vehicle_registration
                  example: vehicle_registration
      responses:
        '201':
          description: Vehículo registrado exitosamente en estado PENDING
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Vehículo registrado exitosamente.
                  data:
                    $ref: '#/components/schemas/VehicleDto'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No tienes los permisos necesarios para realizar esta acción (falta register_vehicle)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicto - La placa o el N.I.V ya están registrados en el sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Datos de vehículo incompletos o inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /vehicles/{id}:
    delete:
      summary: Desactivar Vehículo Propio (Soft Delete)
      description: |
        Marca el vehículo como inactivo (`is_active = 0` / soft delete) asegurando que no se pueda utilizar en nuevos servicios.
        Preserva la trazabilidad histórica de servicios anteriores.
      tags:
        - Vehículos
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID v7 público del vehículo
          schema:
            type: string
            format: uuid
            example: 01a13dc7-d5ab-7a6c-941c-34747ebaf549
      responses:
        '200':
          description: Vehículo eliminado con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Vehículo eliminado con éxito.
                  data:
                    type: array
                    items: {}
                    example: []
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Vehículo no encontrado o no pertenece al usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # PLANES Y MEMBRESÍAS (FR-11, FR-31)
  # ==========================================
  /plans:
    get:
      summary: Consultar Catálogo de Planes Anuales en USD y VES (FR-11)
      description: |
        Retorna el catálogo de planes de membresía anual con su precio en USD y su conversión dinámica a Bolívares (VES) calculada con la tasa oficial BCV cacheada en Redis (`CachedPlanRepository`).
      tags:
        - Planes y Membresías
      parameters:
        - name: all
          in: query
          required: false
          description: Si se envía `all=1`, incluye planes inactivos (útil para administración).
          schema:
            type: integer
            enum: [0, 1]
            example: 0
      responses:
        '200':
          description: Catálogo de planes consultado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Catálogo de planes consultado exitosamente.
                  data:
                    type: object
                    properties:
                      exchange_rate_usd_ves:
                        type: number
                        format: float
                        example: 45.55
                      plans:
                        type: array
                        items:
                          $ref: '#/components/schemas/PlanDto'

    post:
      summary: Crear Nuevo Plan de Membresía (Admin - FR-31)
      description: Crea un nuevo plan en USD e invalida automáticamente la caché en Redis. Requiere permiso `manage_plans`.
      tags:
        - Planes y Membresías
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price_usd
              properties:
                name:
                  type: string
                  example: Plan Diamante Corporativo 2026
                description:
                  type: string
                  example: Cobertura ilimitada de asistencia vial corporativa.
                price_usd:
                  type: number
                  format: float
                  example: 150.00
                duration_months:
                  type: integer
                  default: 12
                  example: 12
                max_services:
                  type: integer
                  default: 2
                  example: 12
                max_km:
                  type: number
                  format: float
                  default: 100.00
                  example: 500.00
      responses:
        '201':
          description: Plan creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Plan creado exitosamente.
                  data:
                    $ref: '#/components/schemas/PlanDto'

  /plans/{id}:
    put:
      summary: Actualizar Plan de Membresía (Admin - FR-31)
      description: Modifica tarifas en USD, vigencias o límites de un plan por su UUID e invalida la caché en Redis. Requiere permiso `manage_plans`.
      tags:
        - Planes y Membresías
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID v7 del plan
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price_usd
              properties:
                name:
                  type: string
                  example: Plan Básico Vial 2026
                description:
                  type: string
                  example: Cobertura esencial actualizada.
                price_usd:
                  type: number
                  format: float
                  example: 40.00
                duration_months:
                  type: integer
                  example: 12
                max_services:
                  type: integer
                  example: 3
                max_km:
                  type: number
                  format: float
                  example: 60.00
                is_active:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Plan actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Plan actualizado exitosamente.
                  data:
                    $ref: '#/components/schemas/PlanDto'

    delete:
      summary: Desactivar Plan de Membresía (Admin - FR-31)
      description: Desactiva un plan para nuevas compras sin afectar contratos activos previos. Requiere permiso `manage_plans`.
      tags:
        - Planes y Membresías
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID v7 del plan
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Plan desactivado exitosamente

  # ==========================================
  # TASAS BCV Y BANCOS (FR-13)
  # ==========================================
  /banks:
    get:
      summary: Listar y Buscar Bancos Nacionales Sudeban en Redis
      description: Retorna el catálogo de los 23 bancos nacionales (código de 4 dígitos Sudeban y nombre) habilitados para pagos C2P y Pago Móvil. Cacheado en Redis por 24 horas y filtrable en memoria mediante `?q=` (ej. `?q=venez` o `?q=0102`) sin consultar MariaDB.
      tags:
        - Tasas BCV y Bancos
      parameters:
        - name: q
          in: query
          required: false
          description: Búsqueda por nombre de banco o código Sudeban (ej. `venez`, `venezuel`, `0102`)
          schema:
            type: string
            example: venez
      responses:
        '200':
          description: Catálogo de bancos nacionales
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Catálogo de bancos nacionales.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        code:
                          type: string
                          example: "0114"
                        name:
                          type: string
                          example: Bancaribe
                        is_active:
                          type: boolean
                          example: true

  /exchange-rates:
    get:
      summary: Consultar Tasas Oficiales BCV (USD y EUR en Redis) (FR-13)
      description: Retorna las tasas oficiales de compra y venta del BCV (USD y EUR) consultadas desde Bancaribe y almacenadas en Redis + MariaDB.
      tags:
        - Tasas BCV y Bancos
      responses:
        '200':
          description: Tasas de cambio BCV consultadas exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Tasas de cambio BCV consultadas exitosamente.
                  data:
                    type: object
                    properties:
                      USD:
                        type: object
                        properties:
                          compra:
                            type: number
                            example: 45.45
                          venta:
                            type: number
                            example: 45.55
                          date:
                            type: string
                            example: "2026-10-20"
                      EUR:
                        type: object
                        properties:
                          compra:
                            type: number
                            example: 49.10
                          venta:
                            type: number
                            example: 49.25
                          date:
                            type: string
                            example: "2026-10-20"

  /exchange-rates/sync:
    post:
      summary: Forzar Sincronización de Tasas BCV con Bancaribe (Admin)
      description: Consulta el endpoint `BCVMicro/1.0.0/consultaTasa/tasa` de Bancaribe, actualiza Redis y persiste el histórico diario en `exchange_rates`. Requiere permiso `manage_plans`.
      tags:
        - Tasas BCV y Bancos
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tasas de cambio sincronizadas con Bancaribe exitosamente

  # ==========================================
  # CONTRATOS Y CHECKOUT (FR-12)
  # ==========================================
  /checkout:
    post:
      summary: Iniciar Checkout de Contrato de Servicio Anual (FR-12)
      description: |
        Crea un Contrato de Servicio en estado `PENDING_PAYMENT` y genera una Orden de Pago polimórfica (`service_contract`) con la tasa BCV del día (`amount_ves`).
        Si el cliente o vendedor deja la orden pendiente para otro día y la tasa BCV sube, la orden recalcula automáticamente su monto en VES a la tasa vigente del día del pago.
      tags:
        - Contratos y Checkout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - plan_id
              properties:
                plan_id:
                  type: string
                  description: ID numérico o UUID v7 del plan seleccionado
                  example: "1"
                vehicle_id:
                  type: string
                  nullable: true
                  description: Opcional. ID numérico o UUID v7 del vehículo del cliente a amparar bajo el contrato
                  example: 01a13dc7-d5ab-7a6c-941c-34747ebaf549
      responses:
        '201':
          description: Orden de pago y contrato preliminar generados exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Orden de pago generada. Proceda a realizar el pago mediante C2P o Pago Móvil.
                  data:
                    type: object
                    properties:
                      contract:
                        $ref: '#/components/schemas/ServiceContractDto'
                      order:
                        $ref: '#/components/schemas/OrderDto'
                      payment_instructions:
                        type: object
                        properties:
                          commerce_name:
                            type: string
                            example: UbikGo
                          commerce_rif:
                            type: string
                            example: J502098500
                          commerce_phone:
                            type: string
                            example: "04267536320"
                          commerce_bank_code:
                            type: string
                            example: "0114"
                          commerce_bank_name:
                            type: string
                            example: Bancaribe
                          supported_methods:
                            type: array
                            items:
                              type: string
                            example: [c2p, pago_movil]
                          amount_ves:
                            type: number
                            example: 1594.25
                          amount_usd:
                            type: number
                            example: 35.00
                          exchange_rate:
                            type: number
                            example: 45.55

  /contracts:
    get:
      summary: Listar Contratos de Servicio del Usuario Autenticado
      description: Retorna todos los contratos de servicio del cliente con sus cupos disponibles (`remaining_services`, `remaining_km`), timestamps exactos (`starts_at`, `expires_at`) y estado de vigencia.
      tags:
        - Contratos y Checkout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Contratos de servicio consultados exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Contratos de servicio consultados exitosamente.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceContractDto'

  /contracts/verify/{code}:
    get:
      summary: Validación Pública Antifraude de Contratos de Grúa (Anti-IA y Anti-Clonación)
      description: |
        Endpoint público y autoritativo para que clientes, agentes de tránsito o grúistas verifiquen la autenticidad e inmutabilidad de un Contrato de Servicio UbikGo mediante el escaneo del Código QR oficial o ingreso del código alfanumérico.
        - **Anti-Tampering:** Compara la firma criptográfica HMAC-SHA256 y firma digital X.509 RSA-2048.
        - **Cotejo de Placa:** Si se envía el parámetro `plate`, valida que corresponda al vehículo del contrato. En caso de inconsistencia, retorna una alerta de fraude (`fraud_alert: true`, HTTP 409).
        - **Privacidad:** Los datos sensibles del titular (nombre, cédula) se muestran enmascarados (ej: `J*** P***`).
      tags:
        - Contratos y Checkout
      parameters:
        - name: code
          in: path
          required: true
          description: Código único de verificación (formato `UBKMMYY-XXXX-XXXX`, ej. `UBK1026-8F2A-99C1`) o UUID v7 del contrato.
          schema:
            type: string
            example: UBK1026-8F2A-99C1
        - name: plate
          in: query
          required: false
          description: Placa del vehículo para cotejo antifraude (ej. `AB123CD`).
          schema:
            type: string
            example: AB123CD
      responses:
        '200':
          description: Contrato verificado exitosamente y vigente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  is_valid:
                    type: boolean
                    example: true
                  fraud_alert:
                    type: boolean
                    example: false
                  contract:
                    type: object
                    properties:
                      contract_number:
                        type: string
                        example: "000042"
                      verification_code:
                        type: string
                        example: "UBK1026-8F2A-99C1"
                      status:
                        type: string
                        example: ACTIVE
                      status_label:
                        type: string
                        example: "ACTIVO / VIGENTE"
                      plan_name:
                        type: string
                        example: "Plan Básico Vial"
                      starts_at:
                        type: string
                        example: "2026-10-21 14:00:00"
                      expires_at:
                        type: string
                        example: "2027-10-21 14:00:00"
                      remaining_services:
                        type: integer
                        example: 3
                      remaining_km:
                        type: number
                        example: 60.0
                      vehicle:
                        type: object
                        properties:
                          plate:
                            type: string
                            example: "AB123CD"
                          brand:
                            type: string
                            example: "TOYOTA"
                          model:
                            type: string
                            example: "COROLLA"
                          year:
                            type: integer
                            example: 2022
                          color:
                            type: string
                            example: "PLATA"
                      client_masked:
                        type: object
                        properties:
                          name:
                            type: string
                            example: "M**** G*******"
                          identification:
                            type: string
                            example: "V-***3456"
                      integrity_verified:
                        type: boolean
                        example: true
                      digital_signature:
                        type: string
                        example: "X.509 RSA-2048 UBIK SERVICE C.A."
                  verified_at:
                    type: string
                    example: "2026-10-21T15:00:00+00:00"
        '404':
          description: Código de verificación no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Alerta de inconsistencia o presunto fraude (placa no coincide o firma adulterada)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alert
                  is_valid:
                    type: boolean
                    example: false
                  fraud_alert:
                    type: boolean
                    example: true
                  alert_message:
                    type: string
                    example: "ALERTA DE SEGURIDAD: La placa consultada no coincide con el registro oficial del contrato."

  /contracts/{id}/pdf:
    get:
      summary: Descargar o Visualizar Contrato de Servicio en PDF (2 páginas con QR y Marca de Agua dinámica)
      description: |
        Genera en tiempo real el **Contrato de Adhesión del Plan de Grúa UbikGo** en formato PDF (2 páginas tamaño Carta) usando FPDF 1.9 y PHPQRCode:
        - **Encabezado:** Nuevo logo oficial UbikGo, pastilla `@UBIKGO / #SomosUBIK` con íconos sociales y código QR vectorial que redirige a la descarga del propio contrato.
        - **Estado `PENDING_PAYMENT`:** Incluye marca de agua diagonal semitransparente **"NO PAGADO"** de extremo a extremo en ambas páginas, sin sello ni vigencia activa.
        - **Estado `ACTIVE`:** Sin marca de agua, muestra el **Sello Oficial PAGADO** entre las firmas y los timestamps exactos (`DESDE dd/mm/yyyy hh:mm:ss a HASTA dd/mm/yyyy hh:mm:ss a`).
        - **Estado `EXPIRED` o `CANCELLED`:** Conserva el **Sello Oficial PAGADO** y los timestamps históricos de vigencia, superponiendo la marca de agua diagonal **"CANCELADO"**.
        - **Acceso:** Puede descargarse directamente desde el navegador escaneando el QR (público por UUID v7 no adivinable) o autenticado vía Bearer JWT.
      tags:
        - Contratos y Checkout
      parameters:
        - name: id
          in: path
          required: true
          description: UUID v7 o ID numérico del contrato de servicio
          schema:
            type: string
            example: 01a14a22-9a8b-7c6d-8e5f-112233445566
        - name: download
          in: query
          required: false
          description: "Enviar `download=1` para forzar descarga (`Content-Disposition: attachment`); por defecto se visualiza inline en el navegador."
          schema:
            type: integer
            enum: [0, 1]
            example: 0
      responses:
        '200':
          description: Documento PDF generado exitosamente
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '403':
          description: No tienes permiso para descargar este contrato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Contrato no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /contracts/{id}/cancel:
    post:
      summary: Cancelar Contrato de Servicio
      description: |
        Cambia el estado del contrato a `CANCELLED`. Al descargarse nuevamente en `/contracts/{id}/pdf`, el documento mostrará la marca de agua diagonal **"CANCELADO"** manteniendo el sello de pago histórico si ya había sido pagado.
      tags:
        - Contratos y Checkout
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID v7 o ID numérico del contrato
          schema:
            type: string
            example: 01a14a22-9a8b-7c6d-8e5f-112233445566
      responses:
        '200':
          description: Contrato cancelado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Contrato cancelado exitosamente.
                  data:
                    $ref: '#/components/schemas/ServiceContractDto'
        '403':
          description: No tienes permiso para cancelar este contrato
        '404':
          description: Contrato no encontrado

  /admin/contracts/expire-overdue:
    post:
      summary: Ejecutar Barrido Manual de Expiración de Contratos Vencidos (Admin / Cron)
      description: |
        Busca todos los contratos en estado `ACTIVE` cuyo timestamp `expires_at` sea menor o igual al instante actual (`NOW()`) y los transiciona en bloque a `EXPIRED`.
        Equivalente a ejecutar por CLI el cronjob `php scripts/expire_contracts.php`. Requiere permiso `manage_plans`.
      tags:
        - Contratos y Checkout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Barrido de expiración ejecutado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Se actualizaron 3 contratos vencidos a estado EXPIRED.
                  data:
                    type: object
                    properties:
                      expired_count:
                        type: integer
                        example: 3
                      executed_at:
                        type: string
                        example: 2026-10-20 21:05:00

  /orders:
    get:
      summary: Listar Órdenes de Pago del Usuario Autenticado
      description: Retorna el historial de órdenes de pago (`service_contract` y `tow_service`) del usuario autenticado, actualizando automáticamente las órdenes `PENDING` si cambió la tasa BCV del día.
      tags:
        - Contratos y Checkout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Órdenes de pago consultadas exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Órdenes de pago consultadas exitosamente.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderDto'

  # ==========================================
  # PAGOS BANCARIBE (FR-14, FR-28, FR-29, FR-30)
  # ==========================================
  /payments/process:
    post:
      summary: Procesar Pago C2P o Conciliar Pago Móvil (Operaciones Plus) con Bancaribe
      description: |
        Ejecuta el cobro o conciliación de una orden pendiente contra la API de **Bancaribe**:
        - **Actualización de Tasa BCV:** Si la orden permaneció `PENDING` desde un día anterior y la tasa BCV cambió, actualiza automáticamente `exchange_rate` y `amount_ves` a la tasa vigente antes de cobrar.
        - **Método `c2p` (Cobro Directo):** Invoca `C2P/1.0.0/registrarPagoC2pApi` enviando el código del banco pagador (`bancoPagador`), cédula (`documentType`, `documentNumber`), teléfono (`telefonoPersona`) y clave dinámica (`otp`).
        - **Método `pago_movil` (Operaciones Plus):** Invoca `COP/1.0.0/consulta-operacion` verificando en firme la referencia bancaria (`reference`), fecha (`date`), monto exacto en VES (`amount`) y cédula del pagador (`identificadorPersona`).
        - **Anti-Replay:** Impide reutilizar una misma referencia o secuencial bancario en más de una orden (`409 Conflict`).
        - **Auditoría de Fallos (FR-30):** Si el banco declina la operación, registra el intento fallido en `payments` con los payloads y retorna `422` sin activar el servicio.
        - **Activación Automática (FR-12):** Al aprobarse el pago, marca la orden como `PAID` y activa inmediatamente el `ServiceContract` por los meses del plan contratado.
      tags:
        - Pagos Bancaribe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order_id
                - payment_method
              properties:
                order_id:
                  type: string
                  description: ID numérico, UUID v7 o número de orden (`ORD-2026-XXXXXX`)
                  example: ORD-2026-8F4A2B
                payment_method:
                  type: string
                  enum: [c2p, pago_movil]
                  example: c2p
                bancoPagador:
                  type: string
                  description: Obligatorio para `c2p`. Código Sudeban de 4 dígitos del banco del cliente.
                  example: "0102"
                documentType:
                  type: string
                  description: Obligatorio para `c2p` (V, E, J, P).
                  example: V
                documentNumber:
                  type: string
                  description: Obligatorio para `c2p`. Número de cédula/RIF sin guiones.
                  example: "12345678"
                telefonoPersona:
                  type: string
                  description: Obligatorio para `c2p`. Teléfono afiliado a Pago Móvil.
                  example: "04141234567"
                otp:
                  type: string
                  description: Obligatorio para `c2p`. Clave dinámica C2P suministrada por el banco del cliente (en modo Sandbox use `000000` para simular rechazo o cualquier otro código como `12345678` para aprobar).
                  example: "12345678"
                reference:
                  type: string
                  description: Obligatorio para `pago_movil`. Número de referencia del Pago Móvil realizado.
                  example: "88776655"
                date:
                  type: string
                  format: date
                  description: Obligatorio para `pago_movil`. Fecha del pago en formato `YYYY-MM-DD`.
                  example: "2026-10-20"
                amount:
                  type: number
                  format: float
                  description: Obligatorio para `pago_movil`. Monto exacto transferido en VES.
                  example: 1594.25
                identificadorPersona:
                  type: string
                  description: Obligatorio para `pago_movil`. Cédula del pagador en formato `V12345678`.
                  example: V12345678
      responses:
        '200':
          description: Pago verificado con Bancaribe y contrato activado exitosamente
        '409':
          description: Orden ya pagada o referencia bancaria duplicada (Anti-Replay)
        '422':
          description: Transacción declinada por el banco o datos incompletos

  /webhooks/bancaribe:
    post:
      summary: Webhook de Notificación Bancaria Asíncrona Bancaribe (FR-14)
      description: |
        Recibe notificaciones de confirmación o rechazo de transacciones desde la pasarela de Bancaribe.
        Valida la firma `X-Bancaribe-Signature` (si `BANCARIBE_WEBHOOK_SECRET` está configurado), registra el pago de forma idempotente y activa el contrato de servicio asociado.
      tags:
        - Pagos Bancaribe
      parameters:
        - name: X-Bancaribe-Signature
          in: header
          required: false
          description: Secreto o firma HMAC del webhook bancario
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order_number
                - reference
                - status
              properties:
                order_number:
                  type: string
                  example: ORD-2026-8F4A2B
                reference:
                  type: string
                  example: "99887766"
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
                  example: APPROVED
                payment_method:
                  type: string
                  enum: [c2p, pago_movil]
                  example: pago_movil
      responses:
        '200':
          description: Webhook procesado exitosamente

  /webhooks/pusher:
    post:
      summary: Webhook de Notificación de Existencia de Canales Pusher (Channel Existence)
      description: |
        Recibe notificaciones de ciclo de vida de canales emitidas por Pusher Channels (`channel_occupied`, `channel_vacated`).
        Valida la firma criptográfica HMAC-SHA256 (`X-Pusher-Signature` con `PUSHER_APP_SECRET`) y registra la presencia o desconexión de unidades en el radar SOS.
      tags:
        - Asistencia SOS y Grúas
      parameters:
        - name: X-Pusher-Key
          in: header
          required: true
          description: Clave pública de la aplicación Pusher
          schema:
            type: string
        - name: X-Pusher-Signature
          in: header
          required: true
          description: Firma criptográfica HMAC-SHA256 generada por Pusher sobre el cuerpo crudo de la petición
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - events
              properties:
                time_ms:
                  type: integer
                  example: 1729660000000
                events:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        enum: [channel_occupied, channel_vacated]
                        example: channel_occupied
                      channel:
                        type: string
                        example: cranes-radar
      responses:
        '200':
          description: Webhook de Pusher procesado exitosamente
        '401':
          description: Firma criptográfica inválida o cabeceras ausentes

  /admin/bank/balances:
    get:
      summary: Consultar Saldos de Cuentas Recaudadoras Bancaribe (Admin)
      description: |
        Consulta los saldos disponibles y bloqueados de las cuentas recaudadoras de la empresa en Bancaribe (`Cuentas/ConsultaSaldo/1.0.0/ctasConsultaSaldos`).
        Cacheado en Redis por 30 minutos (admite `?refresh=1` para forzar consulta en vivo). Requiere rol `admin` con permiso `view_bank_balance`.
      tags:
        - Pagos Bancaribe
      security:
        - BearerAuth: []
      parameters:
        - name: refresh
          in: query
          required: false
          description: Enviar `refresh=1` para omitir la caché de Redis y consultar en tiempo real a Bancaribe.
          schema:
            type: integer
            enum: [0, 1]
            example: 0
      responses:
        '200':
          description: Saldos bancarios consultados exitosamente
        '403':
          description: No posee el permiso view_bank_balance

  /admin/integrations/logs:
    get:
      summary: Consultar Logs de Servicios de Terceros (OCR, Bancaribe, Mapbox, Pusher, S3)
      description: |
        Retorna los registros más recientes de llamadas a integraciones externas almacenados en `storage/logs/integrations.jsonl`, incluyendo servicio, operación, URL, código HTTP, tiempo de respuesta (`duration_ms`), payload sanitizado y respuesta. Requiere rol de administrador (`role:admin`).
      tags:
        - Sistema
      security:
        - BearerAuth: []
      parameters:
        - name: service
          in: query
          required: false
          description: Filtrar por nombre de servicio (`bancaribe`, `ocr`, `mapbox`, `pusher`, `s3`)
          schema:
            type: string
            example: bancaribe
        - name: limit
          in: query
          required: false
          description: Cantidad máxima de registros a devolver (por defecto 50, máx 200)
          schema:
            type: integer
            default: 50
            example: 50
      responses:
        '200':
          description: Logs de integraciones consultados exitosamente

  /contracts/{id}/renew:
    post:
      summary: Renovar Contrato de Servicio Anual (Genera Nueva Orden por Año)
      description: |
        Genera una **nueva Orden de Pago (`Order`)** para renovar un contrato de servicio vencido (`EXPIRED`) o activo.
        Al pagarse esta orden mediante `/payments/process`, el contrato extiende su vigencia por un año más (`+12 months`) y **restaura los kilómetros (`remaining_km`) y la cantidad de servicios (`remaining_services`)** incluidos en el plan.
      tags:
        - Contratos y Checkout
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID v7 o ID numérico del contrato a renovar
          schema:
            type: string
      responses:
        '201':
          description: Orden de renovación anual generada exitosamente

  /contracts/{id}/redeem:
    post:
      summary: Canjear Servicio de Grúa de un Contrato Activo
      description: |
        Consume un (1) servicio disponible (`remaining_services`) y descuenta los kilómetros recorridos (`distance_km`) de un contrato en estado `ACTIVE`.
      tags:
        - Contratos y Checkout
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID v7 o ID numérico del contrato
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                distance_km:
                  type: number
                  format: float
                  example: 25.5
      responses:
        '200':
          description: Servicio de contrato canjeado exitosamente

  # ==========================================
  # MÓDULO COMERCIAL DE VENDEDORAS (SELLER)
  # ==========================================
  /seller/clients/search:
    get:
      summary: Buscar Cliente por Cédula (Redis + Índice Único MariaDB)
      description: |
        Exclusivo para el rol `seller` (`permission:sell_service_contract`).
        Busca un cliente por su número de cédula (`identification_card`) utilizando caché en Redis y el índice único en MariaDB.
        Retorna el perfil del cliente, sus vehículos registrados y sus contratos (indicando cuáles están `EXPIRED` y listos para renovar).
      tags:
        - Contratos y Checkout
      security:
        - BearerAuth: []
      parameters:
        - name: identification_card
          in: query
          required: true
          description: Número de cédula del cliente (ej. `V-12345678`)
          schema:
            type: string
            example: V-18456789
      responses:
        '200':
          description: Resultado de búsqueda de cliente, vehículos y contratos

  /seller/clients:
    post:
      summary: Registrar Cliente Verificado desde Oficina Comercial / WhatsApp (Seller)
      description: |
        Permite a una vendedora registrar un nuevo cliente (mediante foto de cédula con OCR o formulario).
        - Marca automáticamente la cédula del cliente como **`VERIFIED`** sin requerir revisión de un administrador.
        - Genera una contraseña aleatoria segura que cumple con el `Password` Value Object.
        - Envía un correo de bienvenida con identidad visual corporativa UbikGo (`#4E4293` y `#F38218`) con sus credenciales de acceso (con manejo silencioso de errores SMTP para no interrumpir el registro).
      tags:
        - Contratos y Checkout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - phone
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
                identification_card:
                  type: string
                names:
                  type: string
                surnames:
                  type: string
                birth_date:
                  type: string
                  format: date
                document:
                  type: string
                  format: binary
      responses:
        '201':
          description: Cliente registrado y verificado exitosamente

  /seller/vehicles:
    post:
      summary: Registrar Vehículo Verificado para un Cliente (Seller)
      description: |
        Permite a la vendedora registrar un vehículo para un cliente (`client_id`), marcando el vehículo (`is_verified = true`, `status = active`) y su documento (`vehicle_registration` / `niv_certificate`) directamente como **`VERIFIED`** sin requerir aprobación de un administrador.
      tags:
        - Vehículos
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_id
                - plate_number
                - niv
                - year
                - color
              properties:
                client_id:
                  type: string
                  description: ID numérico o UUID v7 del cliente titular
                plate_number:
                  type: string
                niv:
                  type: string
                year:
                  type: integer
                color:
                  type: string
                engine_serial:
                  type: string
                brand_id:
                  type: integer
                model_id:
                  type: integer
                vehicle_class_id:
                  type: integer
                carnet_file_path:
                  type: string
      responses:
        '201':
          description: Vehículo registrado y verificado exitosamente

  /seller/contracts:
    get:
      summary: Listar Contratos Vendidos y Vencidos de la Vendedora
      description: |
        Retorna el listado de contratos gestionados por la vendedora autenticada (`seller_id`), permitiendo filtrar por `?status=EXPIRED` (para gestionar renovaciones), `?status=ACTIVE` (para control de comisiones) o `?status=PENDING_PAYMENT`.
      tags:
        - Contratos y Checkout
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING_PAYMENT, ACTIVE, EXPIRED, CANCELLED]
      responses:
        '200':
          description: Listado de contratos de la vendedora

    post:
      summary: Crear Contrato Preliminar (NO PAGADO) y Orden para Cliente (Seller)
      description: |
        Asigna un plan al vehículo del cliente, genera el contrato en `PENDING_PAYMENT` vinculado a la vendedora (`seller_id`) y retorna la URL del PDF con marca de agua diagonal **"NO PAGADO"**.
        La vendedora concilia luego el pago del cliente exclusivamente mediante `pago_movil` (Operaciones Plus) en `/payments/process`.
      tags:
        - Contratos y Checkout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_id
                - plan_id
              properties:
                client_id:
                  type: string
                plan_id:
                  type: string
                vehicle_id:
                  type: string
      responses:
        '201':
          description: Contrato preliminar y orden generados exitosamente

  /seller/contracts/{id}/renew:
    post:
      summary: Renovar Contrato Vencido de un Cliente (Seller)
      description: Genera una nueva Orden de Pago anual para renovar un contrato vencido y asocia la renovación a la vendedora (`seller_id`).
      tags:
        - Contratos y Checkout
      security:
        - BearerAuth: []
      parameters:
        - name: id
        - in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Orden de renovación anual generada exitosamente

  # ==========================================
  # COMISIONES Y BILLETERA B2B (FR-14, FR-15, FR-34)
  # ==========================================
  /seller/profile:
    get:
      summary: Consultar Perfil Comercial y Datos Bancarios (Seller)
      description: Retorna los datos comerciales de la vendedora, su tasa de comisión pactada y sus datos bancarios registrados.
      tags:
        - Comisiones y Vendedoras
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil comercial consultado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          seller:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 12
                              uuid:
                                type: string
                                format: uuid
                                example: 0192b0c1-3456-7890-abcd-ef0123456789
                              name:
                                type: string
                                example: MARÍA PÉREZ
                              identification_card:
                                type: string
                                example: V-18765432
                              email:
                                type: string
                                example: maria.perez@ubikgo.com
                              phone:
                                type: string
                                example: "+584141234567"
                          profile:
                            $ref: '#/components/schemas/SellerProfileResponseDto'
                          bank:
                            type: object
                            nullable: true
                            properties:
                              id:
                                type: integer
                                example: 1
                              code:
                                type: string
                                example: "0102"
                              name:
                                type: string
                                example: Banco de Venezuela
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /seller/bank-account:
    post:
      summary: Registrar o Actualizar Cuenta Bancaria Nacional (Seller)
      description: |
        Registra o modifica la cuenta bancaria de la vendedora receptora de liquidaciones.
        Valida que el número de cuenta tenga 20 dígitos y que sus primeros 4 dígitos coincidan con el código oficial de Sudeban del banco seleccionado.
      tags:
        - Comisiones y Vendedoras
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bank_id
                - account_number
                - account_type
                - account_holder_name
                - account_holder_id
                - phone_pago_movil
              properties:
                bank_id:
                  type: integer
                  example: 1
                account_number:
                  type: string
                  example: "01140123450123456789"
                account_type:
                  type: string
                  enum: [CORRIENTE, AHORRO]
                  example: "CORRIENTE"
                account_holder_name:
                  type: string
                  example: "Valeria Vendedora"
                account_holder_id:
                  type: string
                  example: "V-20111222"
                phone_pago_movil:
                  type: string
                  example: "04141112233"
      responses:
        '200':
          description: Datos bancarios registrados exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SellerProfileResponseDto'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Error de validación en la cuenta bancaria o discrepancia con Sudeban
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Actualizar Cuenta Bancaria Nacional (Seller)
      description: Equivalente a POST /seller/bank-account para actualización idempotente.
      tags:
        - Comisiones y Vendedoras
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/paths/~1seller~1bank-account/post/requestBody'
      responses:
        '200':
          description: Datos bancarios actualizados exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SellerProfileResponseDto'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Error de validación en los datos bancarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /seller/commissions:
    get:
      summary: Consultar Historial de Comisiones y Resumen de Billetera (Seller)
      description: |
        Retorna el balance de la billetera de comisiones (`total_earned_usd`, `pending_balance_usd`, `withdrawal_requested_usd`, `paid_balance_usd`)
        y el detalle de comisiones generadas por venta de contratos de servicio.
      tags:
        - Comisiones y Vendedoras
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, WITHDRAWAL_REQUESTED, PAID, CANCELLED]
      responses:
        '200':
          description: Historial de comisiones y billetera comercial consultado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SellerCommissionsSummaryResponseDto'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Filtro de estado no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /seller/commissions/withdraw:
    post:
      summary: Solicitar Retiro de Comisiones Pendientes (Seller)
      description: |
        Solicita la liquidación de las comisiones en estado `PENDING`.
        Exige obligatoriamente tener registrados los datos bancarios nacionales completos.
        Transiciona las comisiones al estado `WITHDRAWAL_REQUESTED`.
      tags:
        - Comisiones y Vendedoras
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                commission_ids:
                  type: array
                  items:
                    type: integer
                  description: IDs opcionales de comisiones específicas a retirar. Si se omite, retira todas las pendientes.
      responses:
        '200':
          description: Solicitud de retiro procesada exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/CommissionWithdrawalResponseDto'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Datos bancarios incompletos o saldo pendiente insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
