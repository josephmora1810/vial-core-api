        accepted_at:
          type: string
          nullable: true
          example: null
        arrived_at:
          type: string
          nullable: true
          example: null
        completed_at:
          type: string
          nullable: true
          example: null
        cancelled_at:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          example: 2026-10-22 22:30:00
        updated_at:
          type: string
          example: 2026-10-22 22:30:00

