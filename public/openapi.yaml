          nullable: true
          properties:
            bank_id:
              type: integer
              example: 1
            bank_code:
              type: string
              example: "0102"
            bank_name:
              type: string
              example: Banco de Venezuela
            account_number:
              type: string
              example: "01020123456789012345"
            account_type:
              type: string
              enum: [CORRIENTE, AHORRO]
              example: CORRIENTE
            holder_name:
              type: string
              example: MARÍA PÉREZ
            holder_id:
              type: string
              example: V-18765432
            phone:
              type: string
              example: "04141234567"
        order:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 450
            order_number:
              type: string
              example: ORD-20261023-450
            amount_usd:
              type: number
              format: float
              example: 150.00
            currency:
              type: string
