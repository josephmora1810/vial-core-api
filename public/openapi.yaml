  # ==========================================
  # AUDITORÍA KYC ADMINISTRADOR
  # ==========================================
  /admin/documents:
    get:
      summary: Listar Documentos KYC Pendientes de Revisión (Admin)
      description: Retorna los documentos subidos por usuarios autogestionados filtrados por `?status=PENDING|VERIFIED|REJECTED|ALL`. Requiere permiso `audit_kyc`.
      tags:
        - Documentos KYC
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: PENDING
      responses:
        '200':
          description: Documentos KYC consultados exitosamente

  /admin/documents/{id}/review:
    post:
      summary: Aprobar (VERIFIED) o Rechazar (REJECTED) Documento KYC (Admin)
      description: |
        Permite a un administrador aprobar o denegar la imagen de un documento KYC (`identity_card`, `vehicle_registration`, `niv_certificate`).
        Si se aprueba (`VERIFIED`) el documento de un vehículo, el vehículo pasa automáticamente a `is_verified = true` y `status = active`.
      tags:
        - Documentos KYC
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [VERIFIED, REJECTED]
                  example: VERIFIED
                reason:
                  type: string
                  example: Documento legible y verificado correctamente.
      responses:
        '200':
          description: Documento KYC revisado exitosamente

  # ==========================================
  # OPERADORES DE GRÚA Y VALIDACIÓN DE FLOTA (FR-09, FR-10)
  # ==========================================
  /driver/cranes:
    get:
      summary: Listar Grúas del Conductor Autenticado
      description: "Retorna el listado de unidades de grúa (`type: CRANE`) registradas para el operador autenticado."
      tags:
        - Operadores de Grúa (Flotas)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Grúas del operador consultadas con éxito

    post:
      summary: Registrar Unidad de Grúa con Carnet INTT (FR-09)
      description: |
        Registra una grúa en la flota del conductor (`type: CRANE`). Procesa la imagen del Carnet de Circulación o Título INTT mediante OCR,
        encola automáticamente la subida a AWS S3 (`queue:s3_document_uploads`) y deja la grúa en estado `PENDING` para validación administrativa.
        Opcionalmente permite adjuntar la Licencia de Conducir del chofer en la misma petición.
      tags:
        - Operadores de Grúa (Flotas)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - plate_number
                - niv
                - year
              properties:
                plate_number:
                  type: string
                  example: AB123CD
                niv:
                  type: string
                  example: 8Z1GRUA9988776655
                year:
                  type: integer
                  example: 2021
                color:
                  type: string
                  example: BLANCO
                brand:
                  type: string
                  example: CHEVROLET
                model:
                  type: string
                  example: F-350
                engine_serial:
                  type: string
                  example: MOTOR-F350-99
                carnet:
                  type: string
                  format: binary
                  description: Imagen o PDF del Carnet de Circulación de la grúa.
                license:
                  type: string
                  format: binary
                  description: Imagen de la Licencia de Conducir del chofer (opcional).
                license_grade:
                  type: string
                  example: 5TO GRADO
      responses:
        '201':
          description: Grúa registrada y documentos encolados exitosamente

  /driver/license:
    post:
      summary: Cargar o Actualizar Licencia de Conducir del Chofer (FR-09)
      description: Permite al gruero subir o renovar su Licencia de Conducir (4to o 5to grado). Se encola a AWS S3 y queda en estado `PENDING` para revisión administrativa.
      tags:
        - Operadores de Grúa (Flotas)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - license
              properties:
                license:
                  type: string
                  format: binary
                  description: Fotografía legible de la Licencia de Conducir.
                grade:
                  type: string
                  example: 5TO GRADO
                expiration_date:
                  type: string
                  format: date
                  example: 2029-12-31
      responses:
        '201':
          description: Licencia de conducir cargada exitosamente

  /driver/status:
    get:
      summary: Consultar Estado de Verificación de Flota y Habilitación para Despacho SOS (FR-09, FR-10)
      description: |
        Retorna el estado de verificación dual del conductor:
        - Estado de Cédula de Identidad (`identity_card`).
        - Estado de Licencia de Conducir (`driving_license`).
        - Grúas registradas y estado de sus Carnets INTT (`vehicle_registration`).
        - Bandera `can_operate` / `is_fleet_ready`: `true` únicamente si Cédula y Licencia están `VERIFIED` y el chofer tiene al menos una Grúa activa y verificada.
      tags:
        - Operadores de Grúa (Flotas)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Estado de flota y documentación consultado con éxito

  /driver/shift/current:
    get:
      summary: Consultar Turno y Grúa Activa del Chofer (App Móvil)
      description: |
        Retorna el estado de jornada actual del chofer autenticado, indicando si está en línea (is_active: true/false), la grúa asignada y su última telemetría.
      tags:
        - Operadores de Grúa (Flotas)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Estado de turno consultado exitosamente.

  /driver/shift/start:
    post:
      summary: Iniciar Turno de Chofer y Activar Grúa (Regla 1 Sola Grúa Activa)
      description: |
        Inicia el turno operativo del chofer y asocia la grúa seleccionada.
        Garantiza que el chofer solo tenga UNA grúa activa a la vez. Si el chofer ya se encuentra en un servicio activo (EN_ROUTE o IN_PROGRESS), la operación es rechazada con HTTP 409 Conflict.
      tags:
        - Operadores de Grúa (Flotas)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - crane_id
              properties:
                crane_id:
                  type: integer
                  example: 5
                latitude:
                  type: number
                  format: float
                  example: 10.4900
                longitude:
                  type: number
                  format: float
                  example: -66.8800
      responses:
        '200':
          description: Turno iniciado y grúa activada.
        '409':
          description: Conflicto - Chofer en servicio activo o grúa no verificada.

  /driver/shift/end:
    post:
      summary: Finalizar Turno de Chofer y Desactivar Grúa
      description: |
        Finaliza el turno activo del chofer, desactiva la grúa asociada y la remueve del radar en Redis.
        Si el chofer está en un servicio activo (EN_ROUTE o IN_PROGRESS), la acción es rechazada con HTTP 409 Conflict.
      tags:
        - Operadores de Grúa (Flotas)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Turno finalizado exitosamente.
        '409':
          description: No se puede finalizar turno durante un servicio en curso.

  /driver/cranes/{id}/activate:
    post:
      summary: Activar Grúa Específica para el Turno del Chofer
      description: Cambia la grúa activa del chofer desactivando cualquier otra unidad previa (invariante de 1 grúa activa).
      tags:
        - Operadores de Grúa (Flotas)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Grúa activada exitosamente.
        '409':
          description: No se puede cambiar de grúa mientras se está en servicio activo.

  /driver/location:
    post:
      summary: Actualizar Posición GPS de Grúa en Segundo Plano (Heartbeat Radar)
      description: Actualiza las coordenadas de la grúa en MariaDB y en el radar espacial Redis (GEOADD cranes:locations).
      tags:
        - Operadores de Grúa (Flotas)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - latitude
                - longitude
              properties:
                latitude:
                  type: number
                  format: float
                  example: 10.4850
                longitude:
                  type: number
                  format: float
                  example: -66.8900
      responses:
        '200':
          description: Ubicación de radar actualizada.

  # ==========================================
  # LANDING PAGE Y GALERÍA DINÁMICA (FR-36)
  # ==========================================
  /home-gallery:
    get:
      summary: Obtener Galería de Banners Activos para la Landing Page (FR-36)
      description: |
        Endpoint público optimizado para la aplicación web de Vue.js (Landing Page).
        Retorna únicamente los banners con `is_active = true`, ordenados ascendentemente por `order_index`.
        Incluye la URL pública de la imagen alojada en AWS S3 a través de la tabla polimórfica `images`.
      tags:
        - Landing Page (Galería Dinámica)
      responses:
        '200':
          description: Banners dinámicos activos consultados exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Galería de banners consultada exitosamente.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        title:
                          type: string
                          example: Asistencia Vial 24/7 en Toda Venezuela
                        subtitle:
                          type: string
                          example: La red de grúas más rápida y confiable
                        description:
                          type: string
                          example: Solicita tu grúa en segundos o suscríbete a un plan anual de cobertura total.
                        button_text:
                          type: string
                          example: Ver Planes
                        button_link:
                          type: string
                          example: /planes
                        order_index:
                          type: integer
                          example: 1
                        is_active:
                          type: boolean
                          example: true
                        image_url:
                          type: string
                          example: https://ubik-go.s3.us-east-1.amazonaws.com/gallery/banner_abc123.jpg

  /admin/home-gallery:
    get:
      summary: Listar Todos los Banners de Galería (Administrador) (FR-36)
      description: Retorna el catálogo completo de banners (tanto activos como inactivos) para la consola administrativa.
      tags:
        - Landing Page (Galería Dinámica)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Listado administrativo de banners consultado exitosamente

    post:
      summary: Crear Nuevo Banner de Galería con Imagen S3 (FR-36)
      description: |
        Crea un nuevo banner promocional o informativo para la Landing Page.
        Sube automáticamente el archivo de imagen adjunto a AWS S3 y lo registra en la tabla polimórfica `images` (`imageable_type = 'home_gallery'`).
      tags:
        - Landing Page (Galería Dinámica)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  example: Nueva Cobertura Nacional
                subtitle:
                  type: string
                  example: Ahora disponibles en el oriente del país
                description:
                  type: string
                  example: Más de 50 nuevas unidades de rescate listas para auxiliarte.
                button_text:
                  type: string
                  example: Descargar App
                button_link:
                  type: string
                  example: https://play.google.com/store/apps
                order_index:
                  type: integer
                  example: 2
                is_active:
                  type: boolean
                  example: true
                image:
                  type: string
                  format: binary
                  description: Imagen promocional para el banner (JPG, PNG, WEBP).
      responses:
        '201':
          description: Banner creado y publicado exitosamente

  /admin/home-gallery/{id}:
    put:
      summary: Actualizar Banner de Galería (FR-36)
      description: Actualiza los textos, enlaces, orden de visualización o estado activo/inactivo de un banner existente.
      tags:
        - Landing Page (Galería Dinámica)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                subtitle:
                  type: string
                description:
                  type: string
                button_text:
                  type: string
                button_link:
                  type: string
                order_index:
                  type: integer
                is_active:
                  type: boolean
                image_url:
                  type: string
      responses:
        '200':
          description: Banner actualizado exitosamente

    delete:
      summary: Eliminar Banner de Galería (FR-36)
      description: Elimina permanentemente el banner y sus referencias de imagen.
      tags:
        - Landing Page (Galería Dinámica)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Banner eliminado exitosamente

  # ==========================================
  # MODERACIÓN DE USUARIOS Y AVATARES (FR-35, FR-36)
  # ==========================================
  /profile/avatar:
    post:
      summary: Cargar o Actualizar Foto de Perfil / Avatar (Alias /api/v1/profile/avatar)
      description: Alias directo para la carga y actualización del avatar en AWS S3.
      tags:
        - Usuarios
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Foto de perfil actualizada con URL e iniciales del usuario.

  /users/avatar:
    post:
      summary: Cargar o Actualizar Foto de Perfil / Avatar (FR-36 / SRS pág. 38)
      description: |
        Sube la fotografía de perfil del usuario autenticado a AWS S3 (`users/{id}/avatar_{hex}.ext`)
        y persiste o sobrescribe su registro en la tabla polimórfica 1 a 1 `images` (`imageable_type = 'user'`, `type = 'avatar'`).
        Tras la subida exitosa a S3, el archivo temporal local se elimina inmediatamente.
        La URL de S3 se cachea en Redis (`images:single:user:{id}:avatar`) y se retorna en `GET /api/v1/me`.
      tags:
        - Usuarios
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Archivo de fotografía para el perfil del usuario (JPEG, PNG).
      responses:
        '200':
          description: Foto de perfil actualizada exitosamente

  /admin/users/{id}/suspend:
    post:
      summary: Suspender o Banear Usuario del Sistema (FR-35)
      description: |
        Inhabilita la cuenta de un usuario (`is_active = false`), impidiendo su inicio de sesión
        o uso de cualquier servicio de la plataforma. Inmediatamente revoca todos sus Refresh Tokens
        de sesión activa e inserta una traza de auditoría de seguridad obligatoria con el motivo del baneo.
      tags:
        - Moderación de Usuarios
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario a suspender
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  example: Violación reiterada de las condiciones de servicio y reclamos injustificados.
      responses:
        '200':
          description: Usuario suspendido y sesiones revocadas exitosamente

  /admin/users/{id}/activate:
    post:
      summary: Reactivar Usuario Suspendido (FR-35)
      description: |
        Restaura el acceso al sistema a un usuario previamente suspendido (`is_active = true`),
        registrando la acción y el administrador responsable en la auditoría del sistema.
      tags:
        - Moderación de Usuarios
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario a reactivar
          schema:
            type: integer
      responses:
        '200':
          description: Usuario reactivado exitosamente

  # ==========================================
  # ASISTENCIA VIAL Y TELEMETRÍA (TOWING)
  # ==========================================
  /sos/quote:
    post:
      summary: Pre-Cotizar Asistencia Vial SOS y Verificar Radares Disponibles (FR-20, FR-23)
      description: |
        Calcula la distancia de rescate y traslado usando OSRM, verifica la cobertura del contrato del vehículo o calcula la tarifa express (en USD y VES con tasa oficial BCV), y escanea el radar en MariaDB/Redis.
        Si no hay grúas activas en la zona, can_proceed_payment es falso para evitar cobrarle al cliente en vano.
      tags:
        - Asistencia Vial y Telemetría
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vehicle_id
                - origin
              properties:
                vehicle_id:
                  type: string
                  description: UUID o ID del vehículo registrado del cliente.
                  example: "0194bc02-0000-7000-8000-000000000001"
                origin:
                  type: object
                  required:
                    - latitude
                    - longitude
                  properties:
                    latitude:
                      type: number
                      format: float
                      example: 10.4806
                    longitude:
                      type: number
                      format: float
                      example: -66.9036
                destination:
                  type: object
                  properties:
                    latitude:
                      type: number
                      format: float
                      example: 10.5000
                    longitude:
                      type: number
                      format: float
                      example: -66.9200
                saved_address_id:
                  type: string
                  description: UUID de dirección guardada opcional para destino.
      responses:
        '200':
          description: Cotización calculada exitosamente.
        '400':
          description: Parámetros inválidos.
        '422':
          description: Origen fuera de la geocerca de cobertura.

  /sos:
    post:
      summary: Solicitar Asistencia Vial de Emergencia SOS (FR-20, FR-22, FR-23-B)
      description: |
        Inicia un flujo de emergencia verificando geocerca operativa (Gran Caracas y Litoral Central),
        calculando kilometraje mediante OSRM y validando cobertura de contrato anual.
        Si la distancia excede el saldo o no posee contrato activo, emite una orden de cobro en USD/VES.
        Dispara un evento WebSockets `new-sos-request` al canal `cranes-radar`.
      tags:
        - Asistencia Vial y Telemetría
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vehicle_id
                - origin_lat
                - origin_lng
                - origin_address
                - dest_lat
                - dest_lng
                - dest_address
                - failure_description
              properties:
                vehicle_id:
                  type: string
                  description: UUID v7 o ID numérico del vehículo registrado
                  example: 01a13dc7-d5ab-7a6c-941c-34747ebaf549
                origin_lat:
                  type: number
                  format: float
                  example: 10.4910
                origin_lng:
                  type: number
                  format: float
                  example: -66.8530
                origin_address:
                  type: string
                  example: Distribuidor Altamira, autopista sentido Este
                dest_lat:
                  type: number
                  format: float
                  example: 10.5000
                dest_lng:
                  type: number
                  format: float
                  example: -66.9000
                dest_address:
                  type: string
                  example: Taller Los Ruices, Calle Central
                failure_description:
                  type: string
                  example: Falla mecánica en alternador y batería descargada
                saved_address_id:
                  type: string
                  nullable: true
                  description: UUID o ID opcional de dirección guardada
                  example: null
      responses:
        '201':
          description: Solicitud de asistencia creada exitosamente en estado PENDING
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          service:
                            $ref: '#/components/schemas/TowServiceDto'
                          requires_payment:
                            type: boolean
                            example: false
                          order:
                            type: object
                            nullable: true
                          route:
                            type: object
                            properties:
                              distance_km:
                                type: number
                                example: 14.50
                              duration_minutes:
                                type: number
                                example: 18.2
        '400':
          description: Fuera de geocerca operativa o datos de solicitud inválidos

  /sos/radar:
    get:
      summary: Radar Geoespacial de Solicitudes SOS para Grúas (FR-23, NFR-02)
      description: |
        Retorna las solicitudes en estado `PENDING` ubicadas dentro del radio geoespacial indicado
        utilizando la fórmula de Haversine optimizada en MariaDB (< 200 ms).
      tags:
        - Asistencia Vial y Telemetría
      security:
        - BearerAuth: []
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            format: float
            example: 10.4880
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            format: float
            example: -66.8500
        - name: radius_km
          in: query
          required: false
          schema:
            type: number
            format: float
            default: 25.0
            example: 25.0
      responses:
        '200':
          description: Listado de asistencias pendientes ordenadas por cercanía
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TowServiceDto'

  /radar:
    get:
      summary: Alias del Radar Geoespacial de Grúas (/api/v1/radar)
      description: Alias directo para compatibilidad con la ruta abreviada de la app móvil de grueros.
      tags:
        - Asistencia Vial y Telemetría
      security:
        - BearerAuth: []
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            format: float
            example: 10.4880
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            format: float
            example: -66.8500
        - name: radius_km
          in: query
          required: false
          schema:
            type: number
            format: float
            default: 25.0
      responses:
        '200':
          description: Listado de asistencias pendientes

  /sos/active:
    get:
      summary: Recuperar Servicio de Asistencia Vial Activo (Bootstrap App Móvil)
      description: |
        Retorna el servicio de auxilio vial en curso para el usuario autenticado (Cliente o Conductor).
        Permite que la app móvil reconstruya su estado reactivo tras un reinicio, reconexión o cierre accidental, mostrando la pantalla correcta según el estatus (PENDING, EN_ROUTE o IN_PROGRESS).
        Si el usuario no tiene ningún auxilio activo, retorna data: null.
      tags:
        - Asistencia Vial y Telemetría
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Servicio activo recuperado o null si no existe.

  /sos/cancellation-reasons:
    get:
      summary: Catálogo de Motivos Estandarizados de Cancelación (FR-24-B)
      description: |
        Retorna los motivos de cancelación clasificados para Clientes y Choferes, listos para modales de un solo toque (One-Tap) en la app móvil.
      tags:
        - Asistencia Vial y Telemetría
      security:
        - BearerAuth: []
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [client, driver]
      responses:
        '200':
          description: Catálogo de motivos retornado exitosamente.

  /sos/history:
    get:
      summary: Historial Paginado de Auxilios Viales del Usuario
      description: |
        Lista el historial de servicios de grúa del usuario autenticado (rescatado como cliente o atendido como gruero), con soporte de paginación y filtro opcional por estado.
      tags:
        - Asistencia Vial y Telemetría
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          required: false
          schema:
            type: string
            example: COMPLETED
      responses:
        '200':
          description: Historial paginado consultado exitosamente.

  /sos:
    get:
      summary: Alias de Historial Paginado (/api/v1/sos)
      description: Retorna el mismo historial paginado que /sos/history.
      tags:
        - Asistencia Vial y Telemetría
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Historial paginado.

  /sos/{uuid}:
    get:
      summary: Consultar Estado y Detalle de Servicio SOS (UUID Público)
      description: Retorna el estado en tiempo real de la asistencia vial. Nunca expone el identificador numérico interno.
      tags:
        - Asistencia Vial y Telemetría
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 0192b0c1-3456-7890-abcd-ef0123456789
      responses:
        '200':
          description: Detalle del servicio
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/TowServiceDto'
        '404':
          description: Servicio no encontrado

  /sos/{uuid}/accept:
    post:
      summary: Aceptación Concurrente de Grúa (FR-24, NFR-11-B Pessimistic Locking)
      description: |
        El conductor de la grúa acepta el auxilio.
        Aplica bloqueo pesimista en MariaDB (`SELECT ... FOR UPDATE`) para evitar condiciones de carrera:
        el primer gruero se adjudica el servicio (cambia a `IN_ROUTE`) y los intentos concurrentes posteriores
        reciben código HTTP `409 Conflict`.
      tags:
        - Asistencia Vial y Telemetría
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Servicio adjudicado exitosamente. Estado IN_ROUTE.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/TowServiceDto'
        '409':
          description: Conflicto de carrera - El servicio ya fue tomado por otro operador

  /sos/{uuid}/telemetry:
    put:
      summary: Enviar Pulso GPS de Telemetría (FR-25, FR-26)
      description: |
        La app móvil del gruero emite su coordenada periódicamente (cada 5-10 s).
        Persiste el registro en modo append en `tow_service_logs` y difunde `location-updated`
        al canal WebSockets privado del cliente (`tow-channel-{uuid}`).
      tags:
        - Asistencia Vial y Telemetría
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - latitude
                - longitude
              properties:
                latitude:
                  type: number
                  format: float
                  example: 10.4925
                longitude:
                  type: number
                  format: float
                  example: -66.8540
                speed_kmh:
                  type: number
                  format: float
                  example: 45.0
      responses:
        '200':
          description: Pulso de telemetría procesado y difundido exitosamente
    post:
      summary: Enviar Pulso GPS de Telemetría (Alias POST)
      description: Soporte alternativo HTTP POST para dispositivos con librerías HTTP simplificadas.
      tags:
        - Asistencia Vial y Telemetría
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - latitude
                - longitude
              properties:
                latitude:
                  type: number
                  format: float
                longitude:
                  type: number
                  format: float
                speed_kmh:
                  type: number
                  format: float
      responses:
        '200':
          description: Pulso de telemetría procesado exitosamente

  /sos/{uuid}/arrive:
    post:
      summary: Notificar Llegada de la Grúa al Lugar de Avería (FR-24)
      description: Cambia el estado del servicio de `IN_ROUTE` a `IN_PROGRESS`.
      tags:
        - Asistencia Vial y Telemetría
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estado actualizado a IN_PROGRESS
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/TowServiceDto'

  /sos/{uuid}/complete:
    post:
      summary: Finalizar Servicio y Descontar Cobertura del Contrato (FR-27)
      description: |
        Marca el rescate como `COMPLETED`. Descuenta automáticamente 1 evento y los kilómetros
        reales consumidos del saldo del Contrato de Asistencia del cliente (`service_contracts`).
      tags:
        - Asistencia Vial y Telemetría
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Servicio finalizado exitosamente. Requiere calificación mutua.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/TowServiceDto'

  /sos/{uuid}/cancel:
    post:
      summary: Cancelar Servicio o Reasignar Grúa por Avería Mecánica (FR-24-B, FR-24-C)
      description: |
        Permite cancelar el auxilio a clientes o grueros.
        Si el gruero cancela en ruta especificando `reassign: true` por desperfecto de su propia unidad,
        el servicio regresa a estado `PENDING` y se emite de nuevo `new-sos-request` al radar de rescate.
      tags:
        - Asistencia Vial y Telemetría
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  example: Desperfecto mecánico en sistema hidráulico de la grúa
                reassign:
                  type: boolean
                  default: false
                  description: Indica si debe reanudarse la búsqueda automática para otro operador
                  example: true
      responses:
        '200':
          description: Cancelación o reasignación procesada exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/TowServiceDto'

  /sos/{uuid}/rate:
    post:
      summary: Calificar Asistencia Vial de 1 a 5 Estrellas (FR-27)
      description: |
        Emite la calificación del servicio completado. Invalida la caché del promedio en Redis
        para mantener las métricas actualizadas de inmediato.
      tags:
        - Asistencia Vial y Telemetría
      security:
        - BearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  nullable: true
                  example: Llegó rápido y prestó una atención impecable.
      responses:
        '201':
          description: Calificación registrada exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/RatingDto'






