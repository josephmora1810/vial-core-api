openapi: 3.0.3
info:
  title: UbikGo Core API
  description: |
    API Transaccional de Asistencia Vial construida en PHP 8.5+ Puro con Arquitectura Hexagonal y Domain-Driven Design (DDD).
    Procesa autenticación JWT stateless, validación KYC desatendida mediante OCR (Docker), catálogo de vehículos con caché Redis, y gestión de direcciones favoritas con geolocalización.
  version: 1.0.0

servers:
  - url: http://localhost:8088/api/v1
    description: Servidor de Desarrollo Local

tags:
  - name: Sistema
    description: Endpoints de diagnóstico, salud del servicio y verificación RFC.
  - name: Autenticación
    description: Registro multi-rol, autenticación JWT, pre-escaneo de cédula (OCR), rotación de tokens y recuperación de contraseña vía SMTP.
  - name: Documentos KYC
    description: Gestión del ciclo de vida de documentos de identidad y vehiculares para cumplimiento regulatorio (Know Your Customer).
  - name: Direcciones Guardadas
    description: Libreta de direcciones favoritas con coordenadas GPS para solicitudes rápidas de asistencia vial (FR-19).
  - name: Catálogo de Vehículos
    description: Maestros normalizados de clases, marcas y modelos de vehículos con caché en Redis.
  - name: Vehículos
    description: Escaneo OCR de carnet/título, registro de vehículos propios (FR-18), listado y desactivación lógica (Soft Delete).
  - name: Planes y Membresías
    description: Catálogo de planes anuales en USD con conversión dinámica a VES según tasa oficial BCV (FR-11, FR-31) y caché en Redis.
  - name: Tasas BCV y Bancos
    description: Consulta y sincronización de tasas multimoneda BCV (USD/EUR) con Bancaribe en Redis y listado de bancos nacionales Sudeban (FR-13).
  - name: Contratos y Checkout
    description: Creación de contratos de servicio anual, verificación antifraude QR, descarga de PDF y órdenes de pago polimórficas (ContractController, FR-12, FR-30).
  - name: Pagos Bancaribe
    description: Pasarela bancaria Bancaribe OAuth2 para cobro directo C2P, conciliación Pago Móvil (Operaciones Plus), Webhook de notificación y consulta administrativa de saldos (PaymentController, FR-14, FR-28, FR-29, FR-30).
  - name: Operadores de Grúa (Flotas)
    description: Enrolamiento de unidades de grúa (CRANE), validación obligatoria dual de Carnet INTT y Licencia de Conducir profesional (FR-09, FR-10).
  - name: Asistencia Vial y Telemetría
    description: Solicitud de auxilio SOS, geocerca Gran Caracas, matching algorítmico, telemetría GPS continua con Pusher WebSockets y calificaciones (TowingController, FR-20 al FR-27, NFR-11-B).

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Ingrese su token JWT generado en /login o /register (válido por 15 minutos).

  schemas:
    ApiResponse:
      type: object
      required:
        - status
        - code
        - message
        - data
      properties:
        status:
          type: string
          enum: [success, fail, error]
          example: success
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Operación realizada exitosamente.
        data:
          type: object
          description: Carga útil con la entidad o DTO resultante

    ErrorResponse:
      type: object
      required:
        - status
        - code
        - message
        - data
      properties:
        status:
          type: string
          example: fail
        code:
          type: integer
          example: 400
        message:
          type: string
          example: Mensaje descriptivo del error o validación fallida.
        data:
          type: array
          items: {}
          example: []

    UserDto:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          example: 01a13d0e-d579-7bca-a10d-dfac1b594574
        names:
          type: string
          example: ANDREÍNA SOFÍA
        surnames:
          type: string
          example: QUINTERO BASTIDAS
        full_name:
          type: string
          example: ANDREÍNA SOFÍA QUINTERO BASTIDAS
        identification_card:
          type: string
          example: V-80123456
        birth_date:
          type: string
          format: date
          nullable: true
          example: 1990-04-17
        email:
          type: string
          format: email
          example: cliente@ubikgo.test
        phone:
          type: string
          example: +584121234567
        role:
          type: string
          example: client
        roles:
          type: array
          items:
            type: string
          example: [client]
        wallet_balance:
          type: number
          format: float
          example: 0.00
        is_active:
          type: boolean
          example: true
        avatar_url:
          type: string
          nullable: true
          example: https://ubik-go.s3.us-east-1.amazonaws.com/users/1/avatar_abc123.jpg
        created_at:
          type: string
          example: 2026-10-15 00:55:44
        consent_at:
          type: string
          nullable: true
          example: 2026-10-15 00:55:44

    VehicleDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 01a13dc7-d5ab-7a6c-941c-34747ebaf549
        plate_number:
          type: string
          example: AB123CD
        niv:
          type: string
          example: 8X123456789012345
        engine_serial:
          type: string
          nullable: true
          example: ENG998877
        year:
          type: integer
          example: 2018
        color:
          type: string
          example: Gris Plata
        brand:
          type: string
          nullable: true
          example: Toyota
        model:
          type: string
          nullable: true
          example: Corolla
        vehicle_class:
          type: string
          nullable: true
          example: Automovil
        vehicle_subclass:
          type: string
          nullable: true
          example: null
        status:
          type: string
          enum: [pending, active, inactive, rejected]
          example: pending
        is_verified:
          type: boolean
          example: false
        created_at:
          type: string
          example: 2026-10-15T01:30:00+00:00

    SavedAddressDto:
      type: object
      properties:
