version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: ubik_api_php
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=mariadb
      - DB_NAME=ubikgo
      - DB_USER=ubik
      - DB_PASSWORD=password
      - DATABASE_HOST=mariadb
      - DATABASE_NAME=ubikgo
      - DATABASE_USER=ubik
      - DATABASE_PASSWORD=password
      - REDIS_HOST=redis
      - OSRM_BASE_URL=http://osrm:5000
      - OSRM_PROFILE=driving
    depends_on:
      - mariadb
      - redis
      - osrm

  mariadb:
    image: mariadb:10.11
    container_name: ubik_mariadb
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ubikgo
      MYSQL_USER: ubik
      MYSQL_PASSWORD: password
    volumes:
      - mariadb_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ubik_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    depends_on:
      - mariadb

  redis:
    image: redis:alpine
    container_name: ubik_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  osrm:
    build:
      context: .
      dockerfile: Dockerfile
      target: osrm
    image: osrm/osrm-backend:latest
    container_name: ubik_osrm
    ports:
      - "5000:5000"
    volumes:
      - osrm_data:/data
    restart: unless-stopped

volumes:
  mariadb_data:
  redis_data:
  osrm_data:
